name: Deploy to Xmit

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: xmit-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://bleaktheology.xmit.dev
    env:
      XMIT_SITE: bleaktheology.xmit.dev@268

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 26.7.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and verify
        run: npm run build

      - name: Deploy to Xmit
        env:
          XMIT_KEY: ${{ secrets.XMIT_KEY }}
        run: |
          test -n "$XMIT_KEY" || { echo "XMIT_KEY secret is not set" >&2; exit 1; }
          test -f _site/index.html || { echo "_site/index.html is missing" >&2; exit 1; }
          npx -y @xmit.co/xmit@0.5.2-0 "$XMIT_SITE" _site

      - name: Deployment summary
        run: echo "Deployed to https://bleaktheology.xmit.dev with Xmit team 268" >> "$GITHUB_STEP_SUMMARY"
